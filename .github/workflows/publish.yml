name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check, lint and test
        run: |
          npm run check
          npm run lint
          npm test

      # A release tagged vX.Y.Z must match the version in package.json.
      - name: Ensure release tag matches package version
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF_NAME}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Release tag '$actual' does not match package version '$expected'."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
